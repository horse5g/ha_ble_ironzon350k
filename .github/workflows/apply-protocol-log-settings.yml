name: Apply protocol logging settings update

on:
  push:
    branches:
      - experiment/dp46-lock
    paths:
      - .github/workflows/apply-protocol-log-settings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move 350K protocol logging into integration options
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('custom_components/tuya_local_ble')

          # const.py
          path = root / 'const.py'
          text = path.read_text()
          needle = 'CONF_KEEP_CONNECTED: Final = "keep_connected"\n'
          insert = '''CONF_KEEP_CONNECTED: Final = "keep_connected"\n\n# Per-config-entry diagnostics for the YD_350K. This is intentionally separate\n# from Home Assistant's global logger level so useful parsed protocol events can\n# be enabled without turning on DEBUG for the entire integration.\nCONF_PROTOCOL_LOG_LEVEL: Final = "protocol_log_level"\nPROTOCOL_LOG_OFF: Final = "off"\nPROTOCOL_LOG_EVENTS: Final = "events"\nPROTOCOL_LOG_RAW: Final = "raw"\nPROTOCOL_LOG_LEVELS: Final = (\n    PROTOCOL_LOG_OFF,\n    PROTOCOL_LOG_EVENTS,\n    PROTOCOL_LOG_RAW,\n)\n'''
          assert text.count(needle) == 1
          text = text.replace(needle, insert, 1)
          path.write_text(text)

          # config_flow.py
          path = root / 'config_flow.py'
          text = path.read_text()
          old = '''from .const import (\n    CONF_KEEP_CONNECTED,\n    DOMAIN,\n)'''
          new = '''from .const import (\n    CONF_KEEP_CONNECTED,\n    CONF_PROTOCOL_LOG_LEVEL,\n    DOMAIN,\n    PROTOCOL_LOG_EVENTS,\n    PROTOCOL_LOG_LEVELS,\n    PROTOCOL_LOG_OFF,\n    PROTOCOL_LOG_RAW,\n)'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''            options[CONF_KEEP_CONNECTED] = bool(\n                user_input.get(CONF_KEEP_CONNECTED, False)\n            )\n            return self.async_create_entry(title="", data=options)'''
          new = '''            options[CONF_KEEP_CONNECTED] = bool(\n                user_input.get(CONF_KEEP_CONNECTED, False)\n            )\n            protocol_log_level = str(\n                user_input.get(CONF_PROTOCOL_LOG_LEVEL, PROTOCOL_LOG_OFF)\n            )\n            if protocol_log_level not in PROTOCOL_LOG_LEVELS:\n                protocol_log_level = PROTOCOL_LOG_OFF\n            options[CONF_PROTOCOL_LOG_LEVEL] = protocol_log_level\n            return self.async_create_entry(title="", data=options)'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''                    vol.Optional(\n                        CONF_KEEP_CONNECTED,\n                        default=bool(\n                            self.config_entry.options.get(CONF_KEEP_CONNECTED, False)\n                        ),\n                    ): bool,\n                }'''
          new = '''                    vol.Optional(\n                        CONF_KEEP_CONNECTED,\n                        default=bool(\n                            self.config_entry.options.get(CONF_KEEP_CONNECTED, False)\n                        ),\n                    ): bool,\n                    vol.Optional(\n                        CONF_PROTOCOL_LOG_LEVEL,\n                        default=str(\n                            self.config_entry.options.get(\n                                CONF_PROTOCOL_LOG_LEVEL, PROTOCOL_LOG_OFF\n                            )\n                        ),\n                    ): vol.In(\n                        {\n                            PROTOCOL_LOG_OFF: "Off",\n                            PROTOCOL_LOG_EVENTS: "Parsed events",\n                            PROTOCOL_LOG_RAW: "Raw frames + events",\n                        }\n                    ),\n                }'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)

          # __init__.py: apply the option before the initial status/connect traffic.
          path = root / '__init__.py'
          text = path.read_text()
          old = 'from .const import DOMAIN\n'
          new = '''from .const import (\n    CONF_PROTOCOL_LOG_LEVEL,\n    DOMAIN,\n    PROTOCOL_LOG_OFF,\n)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''    await device.initialize()\n    product_info = get_device_product_info(device)'''
          new = '''    await device.initialize()\n    if device.product_id == "z1dfsaya":\n        device.set_protocol_log_level(\n            str(entry.options.get(CONF_PROTOCOL_LOG_LEVEL, PROTOCOL_LOG_OFF))\n        )\n    product_info = get_device_product_info(device)'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          text = text.replace(
              '    """Reload when options (e.g. keep_connected) change."""',
              '    """Reload when integration options change."""',
              1,
          )
          path.write_text(text)

          # switch.py: logging is no longer a device entity. Keep BLE keeper as-is.
          path = root / 'switch.py'
          text = path.read_text()
          text, count = re.subn(
              r'\n\nclass TuyaBLEVerboseLoggingSwitch\(.*?\n\nclass TuyaBLEKeepAliveSwitch',
              '\n\nclass TuyaBLEKeepAliveSwitch',
              text,
              count=1,
              flags=re.S,
          )
          assert count == 1
          old = '''                TuyaBLEVerboseLoggingSwitch(\n                    hass,\n                    data.coordinator,\n                    data.device,\n                    data.product,\n                ),\n'''
          assert text.count(old) == 1
          text = text.replace(old, '', 1)
          path.write_text(text)

          # tuya_ble.py: three diagnostic levels: off, parsed events, full raw.
          path = root / 'tuya_ble' / 'tuya_ble.py'
          text = path.read_text()
          old = '''from ..const import (\n    DP_350K_LAST_ACCESS_EVENT,\n    DP_350K_LAST_ACCESS_EVENT_TIME,\n    DP_350K_LAST_CREDENTIAL_ID,\n    DP_350K_LAST_LOCK_RECORD,\n)'''
          new = '''from ..const import (\n    DP_350K_LAST_ACCESS_EVENT,\n    DP_350K_LAST_ACCESS_EVENT_TIME,\n    DP_350K_LAST_CREDENTIAL_ID,\n    DP_350K_LAST_LOCK_RECORD,\n    PROTOCOL_LOG_EVENTS,\n    PROTOCOL_LOG_LEVELS,\n    PROTOCOL_LOG_OFF,\n    PROTOCOL_LOG_RAW,\n)'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        # Local-only UI-controlled protocol diagnostics for the 350K. This does\n        # not write anything to the lock and is intentionally off by default.\n        self._verbose_logging = False'''
          new = '''        # Per-entry protocol diagnostics for the 350K. Controlled from the\n        # integration Options flow rather than exposed as a lock entity.\n        self._protocol_log_level = PROTOCOL_LOG_OFF'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    @property\n    def verbose_logging(self) -> bool:\n        """Return whether local 350K protocol diagnostics are enabled."""\n        return self._verbose_logging\n\n    def set_verbose_logging(self, enabled: bool) -> None:\n        """Enable or disable local 350K protocol diagnostics."""\n        enabled = bool(enabled)\n        if self._verbose_logging == enabled:\n            return\n        self._verbose_logging = enabled\n        _LOGGER.info(\n            "%s: 350K verbose protocol logging %s",\n            self.address,\n            "enabled" if enabled else "disabled",\n        )\n\n    def _log_350k_verbose(self, message: str, *args: object) -> None:\n        """Emit opt-in 350K protocol detail without changing global log level."""\n        if self.product_id == "z1dfsaya" and self._verbose_logging:\n            _LOGGER.info(message, *args)'''
          new = '''    @property\n    def protocol_log_level(self) -> str:\n        """Return the configured YD_350K protocol diagnostic level."""\n        return self._protocol_log_level\n\n    @property\n    def verbose_logging(self) -> bool:\n        """Compatibility view for older callers: any diagnostics enabled."""\n        return self._protocol_log_level != PROTOCOL_LOG_OFF\n\n    def set_verbose_logging(self, enabled: bool) -> None:\n        """Compatibility setter used by older builds."""\n        self.set_protocol_log_level(\n            PROTOCOL_LOG_EVENTS if enabled else PROTOCOL_LOG_OFF\n        )\n\n    def set_protocol_log_level(self, level: str) -> None:\n        """Set YD_350K protocol diagnostics: off, parsed events, or raw."""\n        level = str(level).lower()\n        if level not in PROTOCOL_LOG_LEVELS:\n            level = PROTOCOL_LOG_OFF\n        if self._protocol_log_level == level:\n            return\n        self._protocol_log_level = level\n        _LOGGER.info(\n            "%s: 350K protocol logging level set to %s",\n            self.address,\n            level,\n        )\n\n    def _log_350k_event(self, message: str, *args: object) -> None:\n        """Emit parsed DP/event diagnostics at events and raw levels."""\n        if (\n            self.product_id == "z1dfsaya"\n            and self._protocol_log_level in (PROTOCOL_LOG_EVENTS, PROTOCOL_LOG_RAW)\n        ):\n            _LOGGER.info(message, *args)\n\n    def _log_350k_raw(self, message: str, *args: object) -> None:\n        """Emit full protocol frames only at the raw diagnostic level."""\n        if (\n            self.product_id == "z1dfsaya"\n            and self._protocol_log_level == PROTOCOL_LOG_RAW\n        ):\n            _LOGGER.info(message, *args)'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          # Parsed DP/event messages become the middle verbosity level.
          text = text.replace('self._log_350k_verbose(', 'self._log_350k_event(')

          # Full decrypted payloads belong only to raw mode (two receive cases).
          raw_marker = '''self._log_350k_event(\n                        "%s: 350K raw %s plaintext: %s",'''
          assert text.count(raw_marker) == 2
          text = text.replace(
              raw_marker,
              '''self._log_350k_raw(\n                        "%s: 350K raw %s plaintext: %s",''',
          )

          # Full encrypted GATT chunks are also raw-only for the 350K, while
          # other Tuya products retain their normal DEBUG behavior.
          old = '''                    if self.product_id != "z1dfsaya" or self._verbose_logging:\n                        _LOGGER.debug(\n                            "%s: Sending packet: %s", self.address, packet.hex()\n                        )'''
          new = '''                    if self.product_id == "z1dfsaya":\n                        self._log_350k_raw(\n                            "%s: Sending packet: %s", self.address, packet.hex()\n                        )\n                    else:\n                        _LOGGER.debug(\n                            "%s: Sending packet: %s", self.address, packet.hex()\n                        )'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        if self.product_id != "z1dfsaya" or self._verbose_logging:\n            _LOGGER.debug("%s: Packet received: %s", self.address, data.hex())'''
          new = '''        if self.product_id == "z1dfsaya":\n            self._log_350k_raw(\n                "%s: Packet received: %s", self.address, data.hex()\n            )\n        else:\n            _LOGGER.debug("%s: Packet received: %s", self.address, data.hex())'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          # Include outgoing 350K V4 plaintext in raw mode as well.
          old = '''            _LOGGER.debug(\n                "%s: Sending 350K control update, id: %s, value: %s",\n                self.address,\n                dp_id,\n                value,\n            )\n            try:'''
          new = '''            _LOGGER.debug(\n                "%s: Sending 350K control update, id: %s, value: %s",\n                self.address,\n                dp_id,\n                value,\n            )\n            self._log_350k_raw(\n                "%s: 350K raw FUN_SENDER_DPS_V4 plaintext: %s",\n                self.address,\n                payload.hex(),\n            )\n            try:'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          assert '_verbose_logging' not in text
          assert '_log_350k_verbose' not in text
          path.write_text(text)

          # User-visible option strings and removal of the old entity name.
          for rel in ('strings.json', 'translations/en.json'):
              path = root / rel
              data = json.loads(path.read_text())
              init = data['options']['step']['init']
              init['description'] = (
                  'Integration options. Keep connected controls persistent BLE behavior; '
                  '350K protocol logging controls local diagnostic detail without changing '
                  'Home Assistant\'s global logger level.'
              )
              init['data']['protocol_log_level'] = '350K protocol logging'
              init.setdefault('data_description', {})['protocol_log_level'] = (
                  'Off: no extra 350K diagnostics. Parsed events: decoded datapoints and '
                  'timed events. Raw frames + events: also include encrypted BLE fragments '
                  'and decrypted Tuya V4 payloads. Raw mode may contain credential IDs or '
                  'other lock event data, so use it only while troubleshooting.'
              )
              data.get('entity', {}).get('switch', {}).pop('verbose_logging', None)
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          # Documentation: preserve exact working behavior, just move the logging control.
          path = Path('README.md')
          text = path.read_text()
          text = text.replace(
              '- Optional verbose 350K protocol logging.',
              '- Configurable 350K protocol logging under the integration Configure dialog (Off / Parsed events / Raw frames + events).',
          )
          path.write_text(text)

          path = Path('docs/350k-protocol-notes.md')
          if path.exists():
              text = path.read_text()
              if '## Protocol logging' not in text:
                  text += '''\n\n## Protocol logging\n\nThe old per-lock `Verbose protocol logging` switch has been removed. Configure logging from **Settings → Devices & services → Tuya BLE → Configure**. Levels are `Off`, `Parsed events`, and `Raw frames + events`. Raw mode can expose lock event details in logs and should normally remain off.\n'''
              path.write_text(text)
          PY

      - name: Validate integration source
        shell: bash
        run: |
          python -m compileall -q custom_components/tuya_local_ble
          python -m json.tool custom_components/tuya_local_ble/strings.json >/dev/null
          python -m json.tool custom_components/tuya_local_ble/translations/en.json >/dev/null
          grep -R "TuyaBLEVerboseLoggingSwitch\|_verbose_logging\|_log_350k_verbose" custom_components/tuya_local_ble && exit 1 || true
          grep -n "protocol_log_level" custom_components/tuya_local_ble/config_flow.py
          grep -n "set_protocol_log_level" custom_components/tuya_local_ble/tuya_ble/tuya_ble.py

      - name: Commit the update and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-protocol-log-settings.yml
          git add -A
          git commit -m "Move 350K protocol logging to integration options"
          git push
