name: Add 350K sanitized event timeline

on:
  push:
    branches:
      - experiment/dp46-lock
    paths:
      - .github/workflows/add-350k-event-timeline.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/dp46-lock
          fetch-depth: 0

      - name: Apply event timeline patch
        run: python .github/scripts/add_350k_event_timeline.py

      - name: Validate
        run: |
          python -m py_compile custom_components/tuya_local_ble/*.py custom_components/tuya_local_ble/tuya_ble/*.py
          python - <<'PY'
          import json
          for path in [
              'custom_components/tuya_local_ble/strings.json',
              'custom_components/tuya_local_ble/translations/en.json',
              'custom_components/tuya_local_ble/manifest.json',
          ]:
              with open(path, encoding='utf-8') as f:
                  json.load(f)
          PY
          git diff --check
          grep -q 'DP_350K_EVENT_TIMELINE_COUNT' custom_components/tuya_local_ble/const.py
          grep -q 'def _record_350k_event_timeline' custom_components/tuya_local_ble/tuya_ble/tuya_ble.py
          grep -q 'event_timeline_recorder' custom_components/tuya_local_ble/sensor.py
          grep -q 'Sanitized event timeline' README.md

      - name: Commit timeline and remove bootstrap files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/add-350k-event-timeline.yml
          rm -f .github/scripts/add_350k_event_timeline.py
          git add README.md custom_components .github || true
          git commit -m 'Add sanitized 350K event timeline'
          git push origin HEAD:experiment/dp46-lock
