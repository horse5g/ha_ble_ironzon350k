name: Add sanitized 350K event timeline

on:
  push:
    branches:
      - experiment/dp46-lock
    paths:
      - .github/workflows/add-350k-event-timeline.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/dp46-lock
          fetch-depth: 0

      - name: Add sanitized event timeline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('custom_components/tuya_local_ble')

          p = root / 'const.py'
          s = p.read_text()
          needle = 'DP_350K_UNKNOWN_DP_COUNT: Final = -3518\n'
          if 'DP_350K_EVENT_TIMELINE_COUNT' not in s:
              assert needle in s
              s = s.replace(needle, needle + 'DP_350K_EVENT_TIMELINE_COUNT: Final = -3519\n', 1)
          p.write_text(s)

          p = root / 'tuya_ble' / 'tuya_ble.py'
          s = p.read_text()

          needle = '    DP_350K_UNKNOWN_DP_COUNT,\n    PROTOCOL_LOG_EVENTS,\n'
          if '    DP_350K_EVENT_TIMELINE_COUNT,' not in s:
              assert needle in s
              s = s.replace(needle, '    DP_350K_UNKNOWN_DP_COUNT,\n    DP_350K_EVENT_TIMELINE_COUNT,\n    PROTOCOL_LOG_EVENTS,\n', 1)

          marker = '_350K_INTERPRETED_DPS = frozenset({\n    8,   # battery\n'
          if '_350K_EVENT_TIMELINE_CAPACITY' not in s:
              assert marker in s
              s = s.replace(marker, '_350K_EVENT_TIMELINE_CAPACITY = 25\n# Credential/user identifiers are useful elsewhere in dedicated diagnostics,\n# but the generic timeline deliberately redacts them so it is safer to share.\n_350K_TIMELINE_SENSITIVE_SCALAR_DPS = frozenset({12, 13, 19})\n\n_350K_INTERPRETED_DPS = frozenset({\n    8,   # battery\n', 1)

          needle = '        self._350k_unknown_dps: dict[int, dict[str, object]] = {}\n        self._350k_unknown_dp_overflow = 0\n        # Session-local diagnostics. These intentionally reset when the HA\n'
          if 'self._350k_event_timeline' not in s:
              assert needle in s
              s = s.replace(needle, '        self._350k_unknown_dps: dict[int, dict[str, object]] = {}\n        self._350k_unknown_dp_overflow = 0\n        # Bounded, session-local ordering of decoded 350K reports. The timeline\n        # never keeps raw/string/bitmap payload contents or credential IDs.\n        self._350k_event_timeline: list[dict[str, object]] = []\n        # Session-local diagnostics. These intentionally reset when the HA\n', 1)

          needle = '                self._datapoints._update_from_device(\n                    DP_350K_UNKNOWN_DP_COUNT,\n                    time.time(),\n                    0,\n                    TuyaBLEDataPointType.DT_VALUE,\n                    0,\n                )\n            self._decode_advertisement_data()\n'
          if 'DP_350K_EVENT_TIMELINE_COUNT,\n                    now,' not in s:
              assert needle in s
              repl = '                now = time.time()\n                self._datapoints._update_from_device(\n                    DP_350K_UNKNOWN_DP_COUNT,\n                    now,\n                    0,\n                    TuyaBLEDataPointType.DT_VALUE,\n                    0,\n                )\n                self._datapoints._update_from_device(\n                    DP_350K_EVENT_TIMELINE_COUNT,\n                    now,\n                    0,\n                    TuyaBLEDataPointType.DT_VALUE,\n                    0,\n                )\n            self._decode_advertisement_data()\n'
              s = s.replace(needle, repl, 1)

          anchor = '    def _record_350k_unknown_dp(\n        self,\n        dp_id: int,\n'
          if 'def _record_350k_event_timeline(' not in s:
              assert anchor in s
              insert = '''    @property
    def event_timeline_diagnostics(self) -> dict[str, object]:
        """Return a JSON-safe snapshot of the recent sanitized 350K timeline."""
        return {
            "count": len(self._350k_event_timeline),
            "capacity": _350K_EVENT_TIMELINE_CAPACITY,
            "session_only": True,
            "raw_string_bitmap_contents_stored": False,
            "credential_scalar_dps_redacted": sorted(
                _350K_TIMELINE_SENSITIVE_SCALAR_DPS
            ),
            "events": [dict(event) for event in self._350k_event_timeline],
        }

    def _record_350k_event_timeline(
        self,
        dp_id: int,
        dp_type: TuyaBLEDataPointType,
        raw_value: bytes,
        value: bytes | bool | int | str,
        *,
        timed: bool,
        timestamp: int | float,
        event_seq: int,
        kind: int,
    ) -> TuyaBLEDataPoint | None:
        """Record one decoded 350K event without retaining sensitive payloads."""
        if self.product_id != "z1dfsaya":
            return None

        payload_redacted = False
        scalar: bool | int | None = None
        if dp_type == TuyaBLEDataPointType.DT_BOOL:
            scalar = bool(value)
        elif dp_type in (TuyaBLEDataPointType.DT_ENUM, TuyaBLEDataPointType.DT_VALUE):
            if dp_id in _350K_TIMELINE_SENSITIVE_SCALAR_DPS:
                payload_redacted = True
            else:
                scalar = int(value)
        else:
            payload_redacted = True

        entry: dict[str, object] = {
            "timestamp": int(timestamp),
            "sequence": int(event_seq),
            "kind": int(kind),
            "dp": int(dp_id),
            "type": dp_type.name,
            "length": len(raw_value),
            "source": "timed" if timed else "ordinary",
            "interpreted": dp_id in _350K_INTERPRETED_DPS,
            "payload_redacted": payload_redacted,
        }
        if scalar is not None:
            entry["scalar"] = scalar

        self._350k_event_timeline.append(entry)
        if len(self._350k_event_timeline) > _350K_EVENT_TIMELINE_CAPACITY:
            del self._350k_event_timeline[
                : len(self._350k_event_timeline) - _350K_EVENT_TIMELINE_CAPACITY
            ]

        self._datapoints._update_from_device(
            DP_350K_EVENT_TIMELINE_COUNT,
            time.time(),
            0,
            TuyaBLEDataPointType.DT_VALUE,
            len(self._350k_event_timeline),
        )
        return self._datapoints[DP_350K_EVENT_TIMELINE_COUNT]

'''
              s = s.replace(anchor, insert + anchor, 1)

          needle = '            unknown_summary_dp = self._record_350k_unknown_dp(\n                dp_id,\n                dp_type,\n                raw_value,\n                value,\n                timed=True,\n                timestamp=timestamp,\n                event_seq=event_seq,\n            )\n'
          if 'timed=True,\n                timestamp=timestamp,\n                event_seq=event_seq,\n                kind=kind,' not in s:
              assert needle in s
              repl = '            timeline_dp = self._record_350k_event_timeline(\n                dp_id,\n                dp_type,\n                raw_value,\n                value,\n                timed=True,\n                timestamp=timestamp,\n                event_seq=event_seq,\n                kind=kind,\n            )\n            if timeline_dp is not None:\n                datapoints.append(timeline_dp)\n\n' + needle
              s = s.replace(needle, repl, 1)

          needle = '        unknown_summary_dp = self._record_350k_unknown_dp(\n            dp_id,\n            dp_type,\n            raw_value,\n            value,\n            timed=False,\n            timestamp=time.time(),\n            event_seq=event_seq,\n        )\n'
          if 'timed=False,\n            timestamp=event_timestamp,\n            event_seq=event_seq,\n            kind=kind,' not in s:
              assert needle in s
              repl = '        event_timestamp = time.time()\n        timeline_dp = self._record_350k_event_timeline(\n            dp_id,\n            dp_type,\n            raw_value,\n            value,\n            timed=False,\n            timestamp=event_timestamp,\n            event_seq=event_seq,\n            kind=kind,\n        )\n        if timeline_dp is not None:\n            datapoints.append(timeline_dp)\n\n        unknown_summary_dp = self._record_350k_unknown_dp(\n            dp_id,\n            dp_type,\n            raw_value,\n            value,\n            timed=False,\n            timestamp=event_timestamp,\n            event_seq=event_seq,\n        )\n'
              s = s.replace(needle, repl, 1)

          p.write_text(s)

          p = root / 'sensor.py'
          s = p.read_text()
          needle = '    DP_350K_UNKNOWN_DP_COUNT,\n)\n'
          if '    DP_350K_EVENT_TIMELINE_COUNT,' not in s:
              assert needle in s
              s = s.replace(needle, '    DP_350K_UNKNOWN_DP_COUNT,\n    DP_350K_EVENT_TIMELINE_COUNT,\n)\n', 1)

          anchor = '\n\n@dataclass\nclass TuyaBLECategorySensorMapping:\n'
          if 'def event_timeline_getter(' not in s:
              assert anchor in s
              insert = '''

def event_timeline_getter(self: TuyaBLESensor) -> None:
    """Expose the bounded sanitized 350K event timeline."""
    snapshot = self._device.event_timeline_diagnostics
    self._attr_native_value = int(snapshot["count"])
    self._attr_extra_state_attributes = {
        "capacity": snapshot["capacity"],
        "session_only": snapshot["session_only"],
        "raw_string_bitmap_contents_stored": snapshot[
            "raw_string_bitmap_contents_stored"
        ],
        "credential_scalar_dps_redacted": snapshot[
            "credential_scalar_dps_redacted"
        ],
        "events": snapshot["events"],
    }
'''
              s = s.replace(anchor, insert + anchor, 1)

          needle = '                TuyaBLESensorMapping(\n                    dp_id=DP_350K_UNKNOWN_DP_COUNT,\n                    getter=unknown_dp_recorder_getter,\n                    description=SensorEntityDescription(\n                        key="unknown_dp_recorder",\n                        icon="mdi:radar",\n                        entity_category=EntityCategory.DIAGNOSTIC,\n                        entity_registry_enabled_default=False,\n                    ),\n                ),\n'
          if 'key="event_timeline_recorder"' not in s:
              assert needle in s
              addition = '                TuyaBLESensorMapping(\n                    dp_id=DP_350K_EVENT_TIMELINE_COUNT,\n                    getter=event_timeline_getter,\n                    description=SensorEntityDescription(\n                        key="event_timeline_recorder",\n                        icon="mdi:timeline-clock-outline",\n                        entity_category=EntityCategory.DIAGNOSTIC,\n                        entity_registry_enabled_default=False,\n                    ),\n                ),\n'
              s = s.replace(needle, needle + addition, 1)
          p.write_text(s)

          for rel in ('strings.json', 'translations/en.json'):
              p = root / rel
              data = json.loads(p.read_text())
              data['entity']['sensor']['event_timeline_recorder'] = {
                  'name': 'Sanitized event timeline'
              }
              p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Validate
        shell: bash
        run: |
          python -m compileall -q custom_components/tuya_local_ble
          python - <<'PY'
          import json
          from pathlib import Path
          for p in (
              Path('custom_components/tuya_local_ble/strings.json'),
              Path('custom_components/tuya_local_ble/translations/en.json'),
          ):
              json.loads(p.read_text())
          PY
          git diff --check
          grep -q 'DP_350K_EVENT_TIMELINE_COUNT' custom_components/tuya_local_ble/const.py
          grep -q 'def _record_350k_event_timeline' custom_components/tuya_local_ble/tuya_ble/tuya_ble.py
          grep -q 'credential_scalar_dps_redacted' custom_components/tuya_local_ble/tuya_ble/tuya_ble.py
          grep -q 'event_timeline_recorder' custom_components/tuya_local_ble/sensor.py

      - name: Commit result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/tuya_local_ble
          git rm .github/workflows/add-350k-event-timeline.yml
          git commit -m 'Add sanitized 350K event timeline'
          git push origin HEAD:experiment/dp46-lock
