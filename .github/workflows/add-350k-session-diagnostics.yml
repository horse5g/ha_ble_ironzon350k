name: Add 350K session diagnostics

on:
  push:
    branches:
      - experiment/dp46-lock
    paths:
      - .github/workflows/add-350k-session-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/dp46-lock
          fetch-depth: 0

      - name: Apply diagnostics patch
        run: python .github/scripts/add_350k_session_diagnostics.py

      - name: Validate
        run: |
          python -m py_compile custom_components/tuya_local_ble/*.py custom_components/tuya_local_ble/tuya_ble/*.py
          python - <<'PY'
          import json
          for path in [
              'custom_components/tuya_local_ble/strings.json',
              'custom_components/tuya_local_ble/translations/en.json',
              'custom_components/tuya_local_ble/manifest.json',
          ]:
              with open(path, encoding='utf-8') as f:
                  json.load(f)
          PY
          git diff --check

      - name: Commit diagnostics and remove bootstrap files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/add-350k-session-diagnostics.yml
          rm -f .github/scripts/add_350k_session_diagnostics.py
          git add README.md custom_components .github || true
          git commit -m 'Add 350K session and command diagnostics'
          git push origin HEAD:experiment/dp46-lock
