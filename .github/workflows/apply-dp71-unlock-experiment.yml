name: Apply experimental DP71 unlock support

on:
  push:
    branches:
      - experiment/dp46-lock
    paths:
      - .github/workflows/apply-dp71-unlock-experiment.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add experimental 350K unlock path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('custom_components/tuya_local_ble')

          # Device method: send the existing TuyaOS DP71 unlock-check V4 payload
          # through the same serialized 350K control path used by confirmed controls.
          p = root / 'tuya_ble' / 'tuya_ble.py'
          s = p.read_text()
          marker = '    async def linger_connected(self, seconds: int, ping_interval: int = 10) -> None:\n'
          if 'async def unlock_350k(' not in s:
              assert s.count(marker) == 1
              method = '''    async def unlock_350k(self) -> bool:\n        \"\"\"Send the experimental YD_350K BLE unlock command.\n\n        The command uses the same 28-byte DP71/0x47 V4 unlock-check payload\n        format already implemented for related TuyaOS FD50 locks. The previous\n        Smart Life capture strongly matches this framing by encrypted GATT write\n        length, but the 350K path remains experimental until physically tested.\n\n        No lock state is changed optimistically. DP47 remains authoritative.\n        \"\"\"\n        if self.product_id != \"z1dfsaya\":\n            raise TuyaBLEDeviceError(0)\n\n        if self._350k_control_lock.locked():\n            _LOGGER.warning(\n                \"%s: Ignoring 350K unlock; another control operation is still pending\",\n                self.address,\n            )\n            return False\n\n        async with self._350k_control_lock:\n            try:\n                payload = self._build_raykube_unlock_v4_data()\n            except Exception:\n                _LOGGER.warning(\n                    \"%s: 350K unlock unavailable; ble_unlock_check is missing or invalid\",\n                    self.address,\n                )\n                return False\n\n            _LOGGER.debug(\n                \"%s: Sending experimental 350K DP71 unlock command\",\n                self.address,\n            )\n            self._log_350k_raw(\n                \"%s: 350K raw experimental DP71 unlock plaintext: %s\",\n                self.address,\n                payload.hex(),\n            )\n\n            try:\n                await self._ensure_connected()\n                if (\n                    self._expected_disconnect\n                    or self._client is None\n                    or not self._client.is_connected\n                ):\n                    _LOGGER.warning(\n                        \"%s: 350K DP71 unlock aborted; device is not connected\",\n                        self.address,\n                    )\n                    return False\n\n                result = await self._send_packet_while_connected(\n                    TuyaBLECode.FUN_SENDER_DPS_V4,\n                    payload,\n                    0,\n                    True,\n                )\n                if not result:\n                    _LOGGER.warning(\n                        \"%s: 350K DP71 unlock was not acknowledged\",\n                        self.address,\n                    )\n                    return False\n\n                # A protocol ACK only confirms receipt. The motor/door state is\n                # still determined exclusively by the later DP47 notification.\n                return True\n            except BLEAK_EXCEPTIONS:\n                _LOGGER.warning(\n                    \"%s: 350K DP71 unlock failed due to BLE communication error\",\n                    self.address,\n                    exc_info=True,\n                )\n                return False\n            except Exception:\n                _LOGGER.exception(\n                    \"%s: Unexpected error sending experimental 350K DP71 unlock\",\n                    self.address,\n                )\n                return False\n\n'''
              s = s.replace(marker, method + marker, 1)
          p.write_text(s)

          # Button: disabled in entity registry by default to avoid accidental unlock.
          p = root / 'button.py'
          s = p.read_text()
          lock_mapping = '''                TuyaBLEButtonMapping(\n                    dp_id=46,\n                    description=ButtonEntityDescription(\n                        key=\"lock_door\",\n                        translation_key=\"lock_door\",\n                        icon=\"mdi:lock\",\n                    ),\n                ),\n'''
          if 'key=\"unlock_door\"' not in s:
              assert s.count(lock_mapping) == 1
              unlock_mapping = lock_mapping + '''                TuyaBLEButtonMapping(\n                    dp_id=71,\n                    description=ButtonEntityDescription(\n                        key=\"unlock_door\",\n                        translation_key=\"unlock_door\",\n                        icon=\"mdi:lock-open\",\n                        entity_registry_enabled_default=False,\n                    ),\n                ),\n'''
              s = s.replace(lock_mapping, unlock_mapping, 1)

          old_press = '''        if self._device.product_id == \"z1dfsaya\" and self._mapping.dp_id == 46:\n            # DP46 (manual_lock) is a one-shot command, not persistent state.\n            # Always send True and leave the local DP cache untouched; DP47 is\n            # the authoritative physical lock state.\n            self._hass.create_task(\n                self._device.set_350k_bool_datapoint(46, True)\n            )\n            return\n\n'''
          if 'self._device.unlock_350k()' not in s:
              assert s.count(old_press) == 1
              new_press = old_press + '''        if self._device.product_id == \"z1dfsaya\" and self._mapping.dp_id == 71:\n            # Experimental authenticated BLE unlock. The command ACK is not\n            # treated as proof of an unlocked door; DP47 remains authoritative.\n            self._hass.create_task(self._device.unlock_350k())\n            return\n\n'''
              s = s.replace(old_press, new_press, 1)
          p.write_text(s)

          # UI strings.
          for rel in ('strings.json', 'translations/en.json'):
              p = root / rel
              data = json.loads(p.read_text())
              buttons = data.setdefault('entity', {}).setdefault('button', {})
              buttons['lock_door']['name'] = 'Lock door'
              buttons['unlock_door'] = {'name': 'Unlock door (experimental)'}
              p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          # Documentation/status.
          p = Path('README.md')
          s = p.read_text()
          s = s.replace(
              '- Secure-lock control via DP79 (current working hypothesis based on physical state correlation; still being tested).',
              '- Secure-lock control via DP79 (confirmed in live testing).',
          )
          s = s.replace(
              '- Remote lock command (DP46 is the likely Tuya `manual_lock` command and still needs live validation here).',
              '- Remote lock command via DP46=`true` (confirmed in live testing).',
          )
          s = s.replace(
              '- Remote unlock command (expected to use the lock\'s BLE-unlock/check flow, not `DP46=false`; exact payload still needs to be confirmed from the official app traffic).',
              '- Remote unlock via an experimental DP71 / `ble_unlock_check` V4 command. The framing is inferred from previous Smart Life captures and must still be physically validated on the 350K. The test button is disabled by default in the entity registry.',
          )
          s = s.replace(
              '| 46 | Tuya `manual_lock` command candidate; not enabled yet |',
              '| 46 | Tuya `manual_lock`; `true` is confirmed to physically lock |',
          )
          s = s.replace(
              '| 71 | BLE unlock/check raw payload candidate; not enabled yet |',
              '| 71 | BLE unlock/check raw command; experimental 19-byte unlock-check payload under test |',
          )
          s = s.replace(
              '| 79 | Secure-lock control candidate; correlates with DP32 physical state |',
              '| 79 | Secure-lock control; confirmed, with DP32 as reported secure state |',
          )
          p.write_text(s)

          p = Path('docs/350k-protocol-notes.md')
          if p.exists():
              s = p.read_text()
              section = '''\n\n## Experimental DP71 unlock\n\nPrevious Smart Life HCI captures showed the first app unlock after a fresh BLE connection as a 68-byte GATT write. That size matches the existing TuyaOS FD50 DP71 (`0x47`) unlock-check command exactly after Tuya header/CRC, AES padding, security flag, IV, and BLE packet framing. The experimental Home Assistant button therefore reuses the existing device-specific `ble_unlock_check` transformation and sends it through `FUN_SENDER_DPS_V4`. The button is disabled by default and does not change state optimistically; DP47 remains authoritative.\n'''
              if '## Experimental DP71 unlock' not in s:
                  s += section
              p.write_text(s)
          PY

      - name: Validate
        shell: bash
        run: |
          python -m compileall -q custom_components/tuya_local_ble
          python -m json.tool custom_components/tuya_local_ble/strings.json >/dev/null
          python -m json.tool custom_components/tuya_local_ble/translations/en.json >/dev/null
          grep -n "async def unlock_350k" custom_components/tuya_local_ble/tuya_ble/tuya_ble.py
          grep -n "unlock_door" custom_components/tuya_local_ble/button.py
          grep -n "entity_registry_enabled_default=False" custom_components/tuya_local_ble/button.py

      - name: Commit and remove bootstrap workflow
        shell: bash
        run: |
          find custom_components -type d -name __pycache__ -prune -exec rm -rf {} +
          git rm -f .github/workflows/apply-dp71-unlock-experiment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs custom_components/tuya_local_ble
          git commit -m "Add experimental DP71 unlock button"
          git push origin HEAD:experiment/dp46-lock
