name: Add 350K test harness

on:
  push:
    branches:
      - experiment/dp46-lock
    paths:
      - .github/workflows/add-350k-test-harness.yml
      - .github/scripts/add_350k_test_harness.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/dp46-lock
          fetch-depth: 0

      - name: Apply 350K test harness patch
        run: python .github/scripts/add_350k_test_harness.py

      - name: Validate Python and JSON
        run: |
          python -m py_compile custom_components/tuya_local_ble/*.py custom_components/tuya_local_ble/tuya_ble/*.py
          python - <<'PY'
          import json
          for path in [
              'custom_components/tuya_local_ble/strings.json',
              'custom_components/tuya_local_ble/translations/en.json',
              'custom_components/tuya_local_ble/manifest.json',
          ]:
              with open(path, encoding='utf-8') as f:
                  json.load(f)
          PY
          python -m unittest discover -s tests -p 'test_350k_*.py' -v
          git diff --check

      - name: Verify sensitive material is not embedded in test helpers
        run: |
          ! grep -R -nE 'local_key\s*=|sec_key\s*=|ble_unlock_check\s*=' tests custom_components/tuya_local_ble/services.py custom_components/tuya_local_ble/tuya_ble/diagnostics_350k.py || false

      - name: Commit implementation and remove bootstrap files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/add-350k-test-harness.yml
          rm -f .github/scripts/add_350k_test_harness.py
          git add README.md custom_components tests .github || true
          git commit -m 'Add 350K local test harness and automation diagnostics'
          git push origin HEAD:experiment/dp46-lock
