name: Apply 350K transport improvements

on:
  push:
    branches:
      - experiment/dp46-lock
    paths:
      - .github/workflows/apply-350k-transport-improvements.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/dp46-lock

      - name: Patch 350K transport and safe unlock diagnostics
        shell: bash
        run: |
          python -c "import base64; exec(base64.b64decode(''))"

      - name: Validate source
        shell: bash
        run: |
          python -m compileall -q custom_components/tuya_local_ble
          python -m json.tool custom_components/tuya_local_ble/strings.json >/dev/null
          python -m json.tool custom_components/tuya_local_ble/translations/en.json >/dev/null

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/tuya_local_ble/tuya_ble/tuya_ble.py
          git rm .github/workflows/apply-350k-transport-improvements.yml
          git commit -m "Match 350K FD50 writes and redact unlock payload"
          git push origin HEAD:experiment/dp46-lock
