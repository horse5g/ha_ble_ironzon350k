name: Ruff

on:
  push:
    branches:
      - main
      - experiment/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Ruff correctness checks
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check --select F"
          src: >-
            custom_components
            tests
