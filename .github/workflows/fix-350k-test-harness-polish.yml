name: Polish 350K test harness availability

on:
  push:
    branches:
      - experiment/dp46-lock
    paths:
      - .github/workflows/fix-350k-test-harness-polish.yml
      - .github/scripts/fix_350k_test_harness_polish.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/dp46-lock
          fetch-depth: 0

      - name: Apply small runtime polish
        run: python .github/scripts/fix_350k_test_harness_polish.py

      - name: Validate
        run: |
          python -m py_compile custom_components/tuya_local_ble/*.py custom_components/tuya_local_ble/tuya_ble/*.py
          python - <<'PY'
          import json
          for path in [
              'custom_components/tuya_local_ble/strings.json',
              'custom_components/tuya_local_ble/translations/en.json',
              'custom_components/tuya_local_ble/manifest.json',
          ]:
              with open(path, encoding='utf-8') as f:
                  json.load(f)
          PY
          python -m unittest discover -s tests -p 'test_350k_*.py' -v
          git diff --check

      - name: Commit and remove bootstrap files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-350k-test-harness-polish.yml
          rm -f .github/scripts/fix_350k_test_harness_polish.py
          git add custom_components .github || true
          git commit -m 'Polish 350K harness availability diagnostics'
          git push origin HEAD:experiment/dp46-lock
