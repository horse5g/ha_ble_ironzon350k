name: Add sanitized 350K unknown-DP recorder

on:
  push:
    branches:
      - experiment/dp46-lock
    paths:
      - .github/workflows/add-350k-unknown-dp-recorder.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/dp46-lock
          fetch-depth: 0

      - name: Apply unknown-DP recorder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('custom_components/tuya_local_ble')

          # const.py
          p = root / 'const.py'
          s = p.read_text()
          needle = 'DP_350K_LAST_ACTUATION_LATENCY_MS: Final = -3517\n'
          repl = needle + 'DP_350K_UNKNOWN_DP_COUNT: Final = -3518\n'
          if 'DP_350K_UNKNOWN_DP_COUNT' not in s:
              assert needle in s
              s = s.replace(needle, repl, 1)
          p.write_text(s)

          # tuya_ble.py
          p = root / 'tuya_ble' / 'tuya_ble.py'
          s = p.read_text()

          needle = '    DP_350K_LAST_ACTUATION_LATENCY_MS,\n'
          repl = needle + '    DP_350K_UNKNOWN_DP_COUNT,\n'
          if '    DP_350K_UNKNOWN_DP_COUNT,' not in s:
              assert needle in s
              s = s.replace(needle, repl, 1)

          needle = 'BLEAK_EXCEPTIONS = (*BLEAK_RETRY_EXCEPTIONS, OSError)\n\n\n'
          repl = '''BLEAK_EXCEPTIONS = (*BLEAK_RETRY_EXCEPTIONS, OSError)\n\n# Datapoints whose 350K receive-side meaning is sufficiently understood that\n# they already have dedicated parsing/entities. Everything else is eligible\n# for the sanitized discovery recorder below.\n_350K_INTERPRETED_DPS = frozenset({\n    8,   # battery\n    12,  # fingerprint credential id\n    13,  # PIN credential id\n    19,  # BLE/app unlock event\n    20,  # raw lock history record (already exposed separately)\n    21,  # credential failure/alarm\n    28,  # language\n    31,  # beep volume\n    32,  # secure-lock reported state\n    33,  # passage mode\n    46,  # manual lock command/status\n    47,  # physical lock state\n    79,  # secure-lock control\n})\n\n\n'''
          if '_350K_INTERPRETED_DPS' not in s:
              assert needle in s
              s = s.replace(needle, repl, 1)

          needle = '''        self._350k_unlock_requested_monotonic: float | None = None\n'''
          repl = '''        self._350k_unlock_requested_monotonic: float | None = None\n        # Session-local, sanitized discovery data for not-yet-understood DPs.\n        # Raw/string/bitmap contents are never stored here. Lists and record\n        # counts are bounded so a noisy/unknown firmware cannot grow memory or\n        # Home Assistant state attributes without limit.\n        self._350k_unknown_dps: dict[int, dict[str, object]] = {}\n        self._350k_unknown_dp_overflow = 0\n'''
          if 'self._350k_unknown_dps' not in s:
              assert needle in s
              s = s.replace(needle, repl, 1)

          needle = '''    async def initialize(self) -> None:\n        _LOGGER.debug("%s: Initializing", self.address)\n        if await self._update_device_info():\n            self._decode_advertisement_data()\n'''
          repl = '''    async def initialize(self) -> None:\n        _LOGGER.debug("%s: Initializing", self.address)\n        if await self._update_device_info():\n            if self.product_id == "z1dfsaya":\n                self._datapoints._update_from_device(\n                    DP_350K_UNKNOWN_DP_COUNT,\n                    time.time(),\n                    0,\n                    TuyaBLEDataPointType.DT_VALUE,\n                    0,\n                )\n            self._decode_advertisement_data()\n'''
          if 'DP_350K_UNKNOWN_DP_COUNT,\n                    time.time(),' not in s:
              assert needle in s
              s = s.replace(needle, repl, 1)

          marker = '''    def get_or_create_datapoint(\n'''
          helper = '''    @property\n    def unknown_dp_diagnostics(self) -> dict[str, object]:\n        """Return a JSON-safe, sanitized snapshot of unknown 350K DPs."""\n        records: list[dict[str, object]] = []\n        for dp_id in sorted(self._350k_unknown_dps):\n            record = self._350k_unknown_dps[dp_id]\n            records.append({\n                "dp": dp_id,\n                "types": list(record["types"]),\n                "lengths": list(record["lengths"]),\n                "count": int(record["count"]),\n                "ordinary_count": int(record["ordinary_count"]),\n                "timed_count": int(record["timed_count"]),\n                "first_seen": int(record["first_seen"]),\n                "last_seen": int(record["last_seen"]),\n                "last_sequence": int(record["last_sequence"]),\n                "scalar_values": list(record["scalar_values"]),\n                "payload_redacted": bool(record["payload_redacted"]),\n            })\n        return {\n            "unique_count": len(records),\n            "overflow_count": self._350k_unknown_dp_overflow,\n            "records": records,\n            "session_only": True,\n            "raw_string_bitmap_contents_stored": False,\n        }\n\n    def _record_350k_unknown_dp(\n        self,\n        dp_id: int,\n        dp_type: TuyaBLEDataPointType,\n        raw_value: bytes,\n        value: bytes | bool | int | str,\n        *,\n        timed: bool,\n        timestamp: int | float,\n        event_seq: int,\n    ) -> TuyaBLEDataPoint | None:\n        """Record bounded metadata for an uninterpreted 350K datapoint.\n\n        This deliberately does not retain RAW, BITMAP, or STRING contents.\n        BOOL/ENUM/VALUE scalars are useful for reverse engineering and are\n        retained in a small bounded unique-value list.\n        """\n        if self.product_id != "z1dfsaya" or dp_id in _350K_INTERPRETED_DPS:\n            return None\n\n        record = self._350k_unknown_dps.get(dp_id)\n        if record is None:\n            if len(self._350k_unknown_dps) >= 32:\n                self._350k_unknown_dp_overflow += 1\n                return None\n            record = {\n                "types": [],\n                "lengths": [],\n                "count": 0,\n                "ordinary_count": 0,\n                "timed_count": 0,\n                "first_seen": int(timestamp),\n                "last_seen": int(timestamp),\n                "last_sequence": int(event_seq),\n                "scalar_values": [],\n                "payload_redacted": False,\n            }\n            self._350k_unknown_dps[dp_id] = record\n\n        types = record["types"]\n        type_name = dp_type.name\n        if type_name not in types and len(types) < 4:\n            types.append(type_name)\n\n        lengths = record["lengths"]\n        raw_len = len(raw_value)\n        if raw_len not in lengths and len(lengths) < 8:\n            lengths.append(raw_len)\n            lengths.sort()\n\n        record["count"] = int(record["count"]) + 1\n        counter_key = "timed_count" if timed else "ordinary_count"\n        record[counter_key] = int(record[counter_key]) + 1\n        record["last_seen"] = int(timestamp)\n        record["last_sequence"] = int(event_seq)\n\n        scalar: bool | int | None = None\n        if dp_type == TuyaBLEDataPointType.DT_BOOL:\n            scalar = bool(value)\n        elif dp_type in (TuyaBLEDataPointType.DT_ENUM, TuyaBLEDataPointType.DT_VALUE):\n            scalar = int(value)\n        else:\n            # RAW/BITMAP/STRING content may contain credential material or\n            # other user data. Keep only its type/length/timing metadata.\n            record["payload_redacted"] = True\n\n        if scalar is not None:\n            values = record["scalar_values"]\n            if scalar not in values and len(values) < 8:\n                values.append(scalar)\n\n        self._log_350k_event(\n            "%s: 350K sanitized unknown DP dp=%s type=%s len=%s timed=%s "\n            "scalar=%r payload_redacted=%s",\n            self.address,\n            dp_id,\n            type_name,\n            raw_len,\n            timed,\n            scalar,\n            bool(record["payload_redacted"]),\n        )\n\n        self._datapoints._update_from_device(\n            DP_350K_UNKNOWN_DP_COUNT,\n            time.time(),\n            0,\n            TuyaBLEDataPointType.DT_VALUE,\n            len(self._350k_unknown_dps),\n        )\n        return self._datapoints[DP_350K_UNKNOWN_DP_COUNT]\n\n'''
          if 'def unknown_dp_diagnostics' not in s:
              assert marker in s
              s = s.replace(marker, helper + marker, 1)

          # Timed V4: record after decoding, before interpretation.
          needle = '''            trailing = data[next_pos:]\n            self._log_350k_event(\n'''
          repl = '''            unknown_summary_dp = self._record_350k_unknown_dp(\n                dp_id,\n                dp_type,\n                raw_value,\n                value,\n                timed=True,\n                timestamp=timestamp,\n                event_seq=event_seq,\n            )\n            if unknown_summary_dp is not None:\n                datapoints.append(unknown_summary_dp)\n\n            trailing = data[next_pos:]\n            self._log_350k_event(\n'''
          if 'timed=True,\n                timestamp=timestamp,' not in s:
              assert needle in s
              s = s.replace(needle, repl, 1)

          # Ordinary V4: record after decoding, before known DP handling.
          needle = '''        if dp_id == 19 and dp_type == TuyaBLEDataPointType.DT_VALUE:\n'''
          repl = '''        unknown_summary_dp = self._record_350k_unknown_dp(\n            dp_id,\n            dp_type,\n            raw_value,\n            value,\n            timed=False,\n            timestamp=time.time(),\n            event_seq=event_seq,\n        )\n        if unknown_summary_dp is not None:\n            datapoints.append(unknown_summary_dp)\n\n        if dp_id == 19 and dp_type == TuyaBLEDataPointType.DT_VALUE:\n'''
          if 'timed=False,\n            timestamp=time.time(),' not in s:
              assert needle in s
              s = s.replace(needle, repl, 1)

          p.write_text(s)

          # sensor.py
          p = root / 'sensor.py'
          s = p.read_text()
          needle = '    DP_350K_LAST_ACTUATION_LATENCY_MS,\n'
          repl = needle + '    DP_350K_UNKNOWN_DP_COUNT,\n'
          if '    DP_350K_UNKNOWN_DP_COUNT,' not in s:
              assert needle in s
              s = s.replace(needle, repl, 1)

          marker = '''\n\n@dataclass\nclass TuyaBLECategorySensorMapping:\n'''
          getter = '''\n\ndef unknown_dp_recorder_getter(self: TuyaBLESensor) -> None:\n    """Expose sanitized session-local unknown-DP metadata."""\n    snapshot = self._device.unknown_dp_diagnostics\n    self._attr_native_value = int(snapshot["unique_count"])\n    self._attr_extra_state_attributes = {\n        "overflow_count": snapshot["overflow_count"],\n        "session_only": snapshot["session_only"],\n        "raw_string_bitmap_contents_stored": snapshot[\n            "raw_string_bitmap_contents_stored"\n        ],\n        "records": snapshot["records"],\n    }\n'''
          if 'def unknown_dp_recorder_getter' not in s:
              assert marker in s
              s = s.replace(marker, getter + marker, 1)

          needle = '''                TuyaBLESensorMapping(\n                    dp_id=DP_350K_LAST_ACTUATION_LATENCY_MS,\n                    description=SensorEntityDescription(\n                        key="last_actuation_latency",\n                        icon="mdi:lock-clock",\n                        native_unit_of_measurement="ms",\n                        entity_category=EntityCategory.DIAGNOSTIC,\n                        entity_registry_enabled_default=False,\n                    ),\n                ),\n'''
          repl = needle + '''                TuyaBLESensorMapping(\n                    dp_id=DP_350K_UNKNOWN_DP_COUNT,\n                    getter=unknown_dp_recorder_getter,\n                    description=SensorEntityDescription(\n                        key="unknown_dp_recorder",\n                        icon="mdi:radar",\n                        entity_category=EntityCategory.DIAGNOSTIC,\n                        entity_registry_enabled_default=False,\n                    ),\n                ),\n'''
          if 'key="unknown_dp_recorder"' not in s:
              assert needle in s
              s = s.replace(needle, repl, 1)
          p.write_text(s)

          # strings/translations
          for rel in ('strings.json', 'translations/en.json'):
              p = root / rel
              data = json.loads(p.read_text())
              sensors = data['entity']['sensor']
              sensors['unknown_dp_recorder'] = {"name": "Unknown DP recorder"}
              p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          # README
          p = Path('README.md')
          s = p.read_text()
          anchor = '## Suggested test sequence\n'
          section = '''## Sanitized unknown-DP recorder\n\nA disabled-by-default diagnostic sensor named **Unknown DP recorder** records session-local metadata for 350K datapoints that are not yet positively interpreted by this project. It is intended for safe exploratory testing while exercising the lock later.\n\nThe sensor state is the number of distinct unknown DPs observed in the current Home Assistant integration session. Its attributes contain a bounded record for each DP with:\n\n- DP number and observed Tuya type(s),\n- payload length(s),\n- total / ordinary / timed occurrence counts,\n- first/last-seen epoch timestamps and last V4 event sequence,\n- up to eight distinct scalar values for BOOL / ENUM / VALUE datapoints,\n- a `payload_redacted` flag.\n\nRAW, BITMAP, and STRING contents are **never retained by this recorder**; only their type, length, timing, and count metadata are kept. The recorder stores at most 32 distinct DPs and eight lengths/scalars per DP. Additional distinct DPs increment `overflow_count` rather than growing attributes indefinitely. Data resets when the integration reloads or Home Assistant restarts.\n\nThis recorder is independent of Raw protocol logging. For routine discovery, leave protocol logging at **Parsed events** (or Off) and enable only the **Unknown DP recorder** entity. Existing Raw logging can still contain decrypted protocol content and should continue to be treated as sensitive.\n\nAn example sanitized record may look like:\n\n```yaml\nstate: 3\nrecords:\n  - dp: 6\n    types: [DT_VALUE]\n    lengths: [4]\n    count: 2\n    ordinary_count: 0\n    timed_count: 2\n    scalar_values: [1]\n    payload_redacted: false\n  - dp: 61\n    types: [DT_RAW]\n    lengths: [19]\n    count: 1\n    scalar_values: []\n    payload_redacted: true\n```\n\n'''
          if '## Sanitized unknown-DP recorder' not in s:
              assert anchor in s
              s = s.replace(anchor, section + anchor, 1)
          p.write_text(s)
          PY

      - name: Validate source
        shell: bash
        run: |
          python -m py_compile \
            custom_components/tuya_local_ble/const.py \
            custom_components/tuya_local_ble/sensor.py \
            custom_components/tuya_local_ble/tuya_ble/tuya_ble.py
          python -m json.tool custom_components/tuya_local_ble/strings.json >/dev/null
          python -m json.tool custom_components/tuya_local_ble/translations/en.json >/dev/null
          git diff --check

      - name: Commit recorder and remove bootstrap workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-350k-unknown-dp-recorder.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md custom_components/tuya_local_ble .github/workflows/add-350k-unknown-dp-recorder.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add sanitized 350K unknown-DP recorder'
          git push origin HEAD:experiment/dp46-lock
