name: Apply protocol logging settings update v2

on:
  push:
    branches:
      - experiment/dp46-lock
    paths:
      - .github/workflows/apply-protocol-log-settings-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('custom_components/tuya_local_ble')

          def sub_once(text, pattern, repl, label, flags=0):
              new, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, got {count}')
              return new

          # Constants
          p = root / 'const.py'
          s = p.read_text()
          if 'CONF_PROTOCOL_LOG_LEVEL' not in s:
              s = sub_once(
                  s,
                  r'CONF_KEEP_CONNECTED: Final = "keep_connected"\n',
                  '''CONF_KEEP_CONNECTED: Final = "keep_connected"\n\n# Per-config-entry diagnostics for the YD_350K. Kept separate from Home\n# Assistant's global logger level so parsed lock traffic can be enabled without\n# enabling DEBUG for the entire integration.\nCONF_PROTOCOL_LOG_LEVEL: Final = "protocol_log_level"\nPROTOCOL_LOG_OFF: Final = "off"\nPROTOCOL_LOG_EVENTS: Final = "events"\nPROTOCOL_LOG_RAW: Final = "raw"\nPROTOCOL_LOG_LEVELS: Final = (\n    PROTOCOL_LOG_OFF,\n    PROTOCOL_LOG_EVENTS,\n    PROTOCOL_LOG_RAW,\n)\n''',
                  'const logging constants',
              )
          p.write_text(s)

          # Options flow
          p = root / 'config_flow.py'
          s = p.read_text()
          s = sub_once(
              s,
              r'from \.const import \(\n\s*CONF_KEEP_CONNECTED,\n\s*DOMAIN,\n\)',
              '''from .const import (\n    CONF_KEEP_CONNECTED,\n    CONF_PROTOCOL_LOG_LEVEL,\n    DOMAIN,\n    PROTOCOL_LOG_EVENTS,\n    PROTOCOL_LOG_LEVELS,\n    PROTOCOL_LOG_OFF,\n    PROTOCOL_LOG_RAW,\n)''',
              'config_flow const import',
          )
          s = sub_once(
              s,
              r'(\s+options\[CONF_KEEP_CONNECTED\] = bool\(\n\s+user_input\.get\(CONF_KEEP_CONNECTED, False\)\n\s+\)\n)(\s+return self\.async_create_entry\(title="", data=options\))',
              r'''\1            protocol_log_level = str(\n                user_input.get(CONF_PROTOCOL_LOG_LEVEL, PROTOCOL_LOG_OFF)\n            )\n            if protocol_log_level not in PROTOCOL_LOG_LEVELS:\n                protocol_log_level = PROTOCOL_LOG_OFF\n            options[CONF_PROTOCOL_LOG_LEVEL] = protocol_log_level\n\2''',
              'options submit',
          )
          s = sub_once(
              s,
              r'(\s+vol\.Optional\(\n\s+CONF_KEEP_CONNECTED,\n\s+default=bool\(\n\s+self\.config_entry\.options\.get\(CONF_KEEP_CONNECTED, False\)\n\s+\),\n\s+\): bool,)(\n\s+\})',
              r'''\1\n                    vol.Optional(\n                        CONF_PROTOCOL_LOG_LEVEL,\n                        default=str(\n                            self.config_entry.options.get(\n                                CONF_PROTOCOL_LOG_LEVEL, PROTOCOL_LOG_OFF\n                            )\n                        ),\n                    ): vol.In(\n                        {\n                            PROTOCOL_LOG_OFF: "Off",\n                            PROTOCOL_LOG_EVENTS: "Parsed events",\n                            PROTOCOL_LOG_RAW: "Raw frames + events",\n                        }\n                    ),\2''',
              'options schema',
          )
          p.write_text(s)

          # Apply option before initial device.update()/connect traffic.
          p = root / '__init__.py'
          s = p.read_text()
          s = sub_once(
              s,
              r'from \.const import DOMAIN\n',
              '''from .const import (\n    CONF_PROTOCOL_LOG_LEVEL,\n    DOMAIN,\n    PROTOCOL_LOG_OFF,\n)\n''',
              '__init__ const import',
          )
          s = sub_once(
              s,
              r'(\s+await device\.initialize\(\)\n)(\s+product_info = get_device_product_info\(device\))',
              r'''\1    if device.product_id == "z1dfsaya":\n        device.set_protocol_log_level(\n            str(entry.options.get(CONF_PROTOCOL_LOG_LEVEL, PROTOCOL_LOG_OFF))\n        )\n\2''',
              'apply protocol log level',
          )
          s = s.replace(
              '"""Reload when options (e.g. keep_connected) change."""',
              '"""Reload when integration options change."""',
          )
          p.write_text(s)

          # Remove the old lock-device verbose switch; keep keepalive switch.
          p = root / 'switch.py'
          s = p.read_text()
          s = sub_once(
              s,
              r'\n\nclass TuyaBLEVerboseLoggingSwitch\(.*?\n\nclass TuyaBLEKeepAliveSwitch',
              '\n\nclass TuyaBLEKeepAliveSwitch',
              'remove verbose switch class',
              flags=re.S,
          )
          s = sub_once(
              s,
              r'\s+TuyaBLEVerboseLoggingSwitch\(\n\s+hass,\n\s+data\.coordinator,\n\s+data\.device,\n\s+data\.product,\n\s+\),\n',
              '\n',
              'remove verbose switch entity creation',
          )
          p.write_text(s)

          # Device logging levels
          p = root / 'tuya_ble' / 'tuya_ble.py'
          s = p.read_text()
          s = sub_once(
              s,
              r'from \.\.const import \(\n\s*DP_350K_LAST_ACCESS_EVENT,\n\s*DP_350K_LAST_ACCESS_EVENT_TIME,\n\s*DP_350K_LAST_CREDENTIAL_ID,\n\s*DP_350K_LAST_LOCK_RECORD,\n\)',
              '''from ..const import (\n    DP_350K_LAST_ACCESS_EVENT,\n    DP_350K_LAST_ACCESS_EVENT_TIME,\n    DP_350K_LAST_CREDENTIAL_ID,\n    DP_350K_LAST_LOCK_RECORD,\n    PROTOCOL_LOG_EVENTS,\n    PROTOCOL_LOG_LEVELS,\n    PROTOCOL_LOG_OFF,\n    PROTOCOL_LOG_RAW,\n)''',
              'tuya_ble const import',
          )
          s = sub_once(
              s,
              r'\s*# Local-only UI-controlled protocol diagnostics for the 350K\. This does\n\s*# not write anything to the lock and is intentionally off by default\.\n\s*self\._verbose_logging = False',
              '''\n        # Per-entry protocol diagnostics for the 350K. Controlled from the\n        # integration Options flow rather than exposed as a lock entity.\n        self._protocol_log_level = PROTOCOL_LOG_OFF''',
              'replace verbose logging state',
          )
          s = sub_once(
              s,
              r'    @property\n    def verbose_logging\(self\) -> bool:.*?\n    def _log_350k_verbose\(self, message: str, \*args: object\) -> None:\n.*?_LOGGER\.info\(message, \*args\)',
              '''    @property\n    def protocol_log_level(self) -> str:\n        """Return the configured YD_350K protocol diagnostic level."""\n        return self._protocol_log_level\n\n    @property\n    def verbose_logging(self) -> bool:\n        """Compatibility view for older callers: any diagnostics enabled."""\n        return self._protocol_log_level != PROTOCOL_LOG_OFF\n\n    def set_verbose_logging(self, enabled: bool) -> None:\n        """Compatibility setter used by older builds."""\n        self.set_protocol_log_level(\n            PROTOCOL_LOG_EVENTS if enabled else PROTOCOL_LOG_OFF\n        )\n\n    def set_protocol_log_level(self, level: str) -> None:\n        """Set YD_350K diagnostics: off, parsed events, or full raw frames."""\n        level = str(level).lower()\n        if level not in PROTOCOL_LOG_LEVELS:\n            level = PROTOCOL_LOG_OFF\n        if self._protocol_log_level == level:\n            return\n        self._protocol_log_level = level\n        _LOGGER.info(\n            "%s: 350K protocol logging level set to %s",\n            self.address,\n            level,\n        )\n\n    def _log_350k_event(self, message: str, *args: object) -> None:\n        """Emit parsed DP/event diagnostics at events and raw levels."""\n        if (\n            self.product_id == "z1dfsaya"\n            and self._protocol_log_level in (PROTOCOL_LOG_EVENTS, PROTOCOL_LOG_RAW)\n        ):\n            _LOGGER.info(message, *args)\n\n    def _log_350k_raw(self, message: str, *args: object) -> None:\n        """Emit full protocol frames only at the raw diagnostic level."""\n        if (\n            self.product_id == "z1dfsaya"\n            and self._protocol_log_level == PROTOCOL_LOG_RAW\n        ):\n            _LOGGER.info(message, *args)''',
              'replace logging methods',
              flags=re.S,
          )
          s = s.replace('self._log_350k_verbose(', 'self._log_350k_event(')
          if s.count('self._log_350k_event(\n                        "%s: 350K raw %s plaintext: %s",') != 2:
              raise RuntimeError('expected two raw plaintext receive log sites')
          s = s.replace(
              'self._log_350k_event(\n                        "%s: 350K raw %s plaintext: %s",',
              'self._log_350k_raw(\n                        "%s: 350K raw %s plaintext: %s",',
          )
          s = sub_once(
              s,
              r'\s+if self\.product_id != "z1dfsaya" or self\._verbose_logging:\n\s+_LOGGER\.debug\(\n\s+"%s: Sending packet: %s", self\.address, packet\.hex\(\)\n\s+\)',
              '''\n                    if self.product_id == "z1dfsaya":\n                        self._log_350k_raw(\n                            "%s: Sending packet: %s", self.address, packet.hex()\n                        )\n                    else:\n                        _LOGGER.debug(\n                            "%s: Sending packet: %s", self.address, packet.hex()\n                        )''',
              'raw outgoing chunks',
          )
          s = sub_once(
              s,
              r'\s+if self\.product_id != "z1dfsaya" or self\._verbose_logging:\n\s+_LOGGER\.debug\("%s: Packet received: %s", self\.address, data\.hex\(\)\)',
              '''\n        if self.product_id == "z1dfsaya":\n            self._log_350k_raw(\n                "%s: Packet received: %s", self.address, data.hex()\n            )\n        else:\n            _LOGGER.debug("%s: Packet received: %s", self.address, data.hex())''',
              'raw incoming chunks',
          )
          s = sub_once(
              s,
              r'(\s+_LOGGER\.debug\(\n\s+"%s: Sending 350K control update, id: %s, value: %s",\n\s+self\.address,\n\s+dp_id,\n\s+value,\n\s+\)\n)(\s+try:)',
              r'''\1            self._log_350k_raw(\n                "%s: 350K raw FUN_SENDER_DPS_V4 plaintext: %s",\n                self.address,\n                payload.hex(),\n            )\n\2''',
              'raw outgoing plaintext',
          )
          if '_verbose_logging' in s or '_log_350k_verbose' in s:
              raise RuntimeError('old verbose logging state remains')
          p.write_text(s)

          # Strings / translation
          for rel in ('strings.json', 'translations/en.json'):
              p = root / rel
              data = json.loads(p.read_text())
              init = data['options']['step']['init']
              init['description'] = (
                  'Integration options. Keep connected controls persistent BLE behavior; '
                  '350K protocol logging controls local diagnostic detail without changing '
                  "Home Assistant's global logger level."
              )
              init['data']['protocol_log_level'] = '350K protocol logging'
              init.setdefault('data_description', {})['protocol_log_level'] = (
                  'Off: no extra 350K diagnostics. Parsed events: decoded datapoints and '
                  'timed events. Raw frames + events: also include encrypted BLE fragments '
                  'and decrypted Tuya V4 payloads. Raw mode may contain credential IDs or '
                  'other lock event data, so use it only while troubleshooting.'
              )
              data.get('entity', {}).get('switch', {}).pop('verbose_logging', None)
              p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          # Docs
          p = Path('README.md')
          s = p.read_text()
          s = s.replace(
              '- Optional verbose 350K protocol logging.',
              '- Configurable 350K protocol logging under the integration Configure dialog (Off / Parsed events / Raw frames + events).',
          )
          p.write_text(s)

          p = Path('docs/350k-protocol-notes.md')
          if p.exists():
              s = p.read_text()
              if '## Protocol logging' not in s:
                  s += '''\n\n## Protocol logging\n\nThe old per-lock `Verbose protocol logging` switch has been removed. Configure logging from **Settings → Devices & services → Tuya BLE → Configure**. Levels are `Off`, `Parsed events`, and `Raw frames + events`. Raw mode can expose lock event details in logs and should normally remain off.\n'''
              p.write_text(s)
          PY

      - name: Validate
        shell: bash
        run: |
          python -m compileall -q custom_components/tuya_local_ble
          python -m json.tool custom_components/tuya_local_ble/strings.json >/dev/null
          python -m json.tool custom_components/tuya_local_ble/translations/en.json >/dev/null
          ! grep -R "TuyaBLEVerboseLoggingSwitch\|_verbose_logging\|_log_350k_verbose" custom_components/tuya_local_ble
          grep -n "protocol_log_level" custom_components/tuya_local_ble/config_flow.py
          grep -n "set_protocol_log_level" custom_components/tuya_local_ble/tuya_ble/tuya_ble.py

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-protocol-log-settings.yml
          rm -f .github/workflows/apply-protocol-log-settings-v2.yml
          git add -A
          git commit -m "Move 350K protocol logging to integration options"
          git push
